[project]
name = "crossslice"
version = "0.1.0"
description = "Demand-driven inter-procedural code context for commits and repositories: def-use sliced neighborhoods across function boundaries, without a build."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Kristoffer Hempel" }, { name = "Nils Loose" }, { name = "Thomas Eisenbarth" }]
keywords = ["program-comprehension", "program-slicing", "call-graph", "code-context", "llm-agents", "mcp", "commits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "gitpython>=3.1.43",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "tree-sitter==0.23.2",
    "tree-sitter-c==0.23.1",
    "tree-sitter-java==0.23.4",
    "mcp>=1.2.0,<2",
]

[project.scripts]
crossslice = "crossslice.cli:main"

[project.urls]
Repository = "https://github.com/UzL-ITS/CrossSlice.git"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossslice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
