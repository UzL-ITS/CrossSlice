name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System tools (GNU Global, clangd, gcc, Java)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends global clangd gcc openjdk-21-jre-headless unzip
      - name: GumTree 4.0.0-beta3
        run: |
          curl -sSL -o /tmp/gumtree.zip https://github.com/GumTreeDiff/gumtree/releases/download/v4.0.0-beta3/gumtree-4.0.0-beta3.zip
          sudo mkdir -p /opt/gumtree && sudo unzip -q /tmp/gumtree.zip -d /opt/gumtree   # found there without GUMTREE_PATH
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run crossslice check
      - run: uv run pytest -q
      - name: Smoke test - code context on the example project
        run: |
          uv run crossslice expand sched_submit -C examples/taskrunner
          uv run crossslice context examples/taskrunner/src/sched.c:50 -C examples/taskrunner --slice
      - name: Smoke test - commit context, zero configuration
        run: |
          bash examples/kvstore-evolution/init.sh
          cd examples/kvstore-evolution/kvstore
          uv run crossslice enrich | head -60
          test -z "$(git status --porcelain --ignored)"   # nothing written into the checkout
